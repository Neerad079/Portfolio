<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="50%" stop-color="#0f0f16"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#f9452d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f9452d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14141c"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glowRed)"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>

  <!-- Border Card Frame -->
  <rect x="36" y="36" width="1128" height="558" rx="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <rect x="37" y="37" width="1126" height="1" fill="rgba(249,69,45,0.5)"/>

  <!-- Top Brand Line -->
  <g transform="translate(80, 100)">
    <!-- Brand Logo -->
    <text x="0" y="24" font-family="'Inter', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="2">
      NEERAD<tspan fill="#f9452d">.</tspan>
    </text>
    
    <!-- Eyebrow Pill -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="410" height="36" rx="18" fill="rgba(249,69,45,0.12)" stroke="rgba(249,69,45,0.3)" stroke-width="1"/>
      <circle cx="20" cy="18" r="5" fill="#f9452d"/>
      <text x="36" y="23" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#ff7a66" letter-spacing="1">
        JAVA &amp; SPRING BOOT DEVELOPER
      </text>
    </g>

    <!-- University Badge -->
    <g transform="translate(740, 0)">
      <rect x="0" y="0" width="300" height="36" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="150" y="23" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#8b929e">
        NIT Srinagar · B.Tech CSE '28
      </text>
    </g>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 230)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Building Secure APIs &amp;
    </text>
    <text x="0" y="65" font-family="'Inter', sans-serif" font-size="52" font-weight="800" fill="#f9452d" letter-spacing="-1">
      Full-Stack Applications
    </text>
  </g>

  <!-- Subtitle Paragraph -->
  <g transform="translate(80, 360)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="22" font-weight="400" fill="#9ca3af" line-height="1.5">
      Specializing in Java, Spring Boot, React, and MySQL. Shipped HireIQ (Razorpay
    </text>
    <text x="0" y="32" font-family="'Inter', sans-serif" font-size="22" font-weight="400" fill="#9ca3af" line-height="1.5">
      BuildAthon 2026) and ISRO Bharatiya Antariksh Hackathon AI frameworks.
    </text>
  </g>

  <!-- Tags / Skills Strip -->
  <g transform="translate(80, 480)">
    <!-- Tag 1: Java -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="130" height="42" rx="8" fill="#14141c" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="65" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#ffffff">Java 17/21</text>
    </g>

    <!-- Tag 2: Spring Boot -->
    <g transform="translate(142, 0)">
      <rect x="0" y="0" width="160" height="42" rx="8" fill="#14141c" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="80" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#ffffff">Spring Boot 3</text>
    </g>

    <!-- Tag 3: React 19 -->
    <g transform="translate(314, 0)">
      <rect x="0" y="0" width="130" height="42" rx="8" fill="#14141c" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="65" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#ffffff">React 19</text>
    </g>

    <!-- Tag 4: MySQL -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="120" height="42" rx="8" fill="#14141c" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="60" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#ffffff">MySQL 8</text>
    </g>

    <!-- Tag 5: Spring Security & JWT -->
    <g transform="translate(588, 0)">
      <rect x="0" y="0" width="170" height="42" rx="8" fill="#14141c" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="85" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#ffffff">Security &amp; JWT</text>
    </g>

    <!-- GitHub Handle Right -->
    <g transform="translate(850, 0)">
      <text x="190" y="27" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="500" fill="#f9452d">
        github.com/Neerad079 ↗
      </text>
    </g>
  </g>
</svg>
